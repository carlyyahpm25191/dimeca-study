const WS=['gato🐱','perro🐶','mariposa🦋','elefante🐘','sol☀️','luna🌙','flor🌸','pájaro🐦','pez🐟','árbol🌳','libro📖','estrella⭐'];
const fal=()=>{const w=pk(WS),wd=w.match(/^[a-záéíóúñ]+/)[0],em=w.slice(wd.length),i=R(0,wd.length-1),l=wd[i];return mk(`Completa la palabra<div class="big2">${em}<br>${wd.slice(0,i)}_${wd.slice(i+1)}</div>`,l,pn('abcdefghilmnoprstuz'.split('').filter(x=>x!==l),3))};
const OR=[['hormiga','ormiga'],['vaca','baca'],['jirafa','girafa'],['zapato','sapato'],['llave','yave'],['hielo','yelo'],['queso','keso'],['hueso','ueso'],['ciudad','siudad'],['guitarra','guitara'],['bonito','vonito'],['ojo','ogo']];
const ort=()=>{const p=pk(OR);return mk('¿Cuál está bien escrita?',p[0],[p[1]])};
const AN=[['grande','pequeño'],['día','noche'],['frío','calor'],['alto','bajo'],['feliz','triste'],['rápido','lento'],['abrir','cerrar'],['subir','bajar'],['limpio','sucio'],['dulce','salado']];
const ant=()=>{const p=pk(AN);return mk(`Lo contrario de <b>${p[0]}</b> es…`,p[1],pn(AN.filter(x=>x!==p).map(x=>x[1]),3))};
const COL=[['🍎','rojo','#e53935'],['🍌','amarillo','#fdd835'],['🌿','verde','#43a047'],['🫐','azul','#1e88e5'],['🍊','naranja','#fb8c00'],['🍇','morado','#8e24aa'],['🌸','rosa','#f48fb1'],['🐻','café','#795548'],['🐈‍⬛','negro','#222'],['☁️','blanco','#fff']];
const cl=c=>`<i class="d" style="background:${c[2]}"></i>${c[1]}`;
const col1=()=>{const c=pk(COL);return mk(`¿De qué color es<div class="big2">${c[0]}</div>?`,cl(c),pn(COL.filter(x=>x!==c),3).map(cl))};
const MIX=[['azul','amarillo','verde'],['rojo','amarillo','naranja'],['rojo','azul','morado'],['rojo','blanco','rosa'],['negro','blanco','gris']];
const mix=()=>{const m=pk(MIX);return mk(`🎨 ${m[0]} + ${m[1]} = ?`,m[2],pn(['verde','naranja','morado','rosa','gris','café','rojo'].filter(x=>x!==m[2]),3))};
const ES=['gato','perro','casa','agua','sol','luna','libro','rojo','azul','hola','gracias','amigo'];
const V={en:['cat','dog','house','water','sun','moon','book','red','blue','hello','thank you','friend'],fr:['chat','chien','maison','eau','soleil','lune','livre','rouge','bleu','bonjour','merci','ami'],ja:['ねこ','いぬ','いえ','みず','たいよう','つき','ほん','あか','あお','こんにちは','ありがとう','ともだち'],ru:['кошка','собака','дом','вода','солнце','луна','книга','красный','синий','привет','спасибо','друг']};
const RM={ja:['neko','inu','ie','mizu','taiyō','tsuki','hon','aka','ao','konnichiwa','arigatō','tomodachi'],ru:['koshka','sobaka','dom','voda','solntse','luna','kniga','krasnyj','sinij','privet','spasibo','drug']};
const LN={en:['Inglés','en-US','🇬🇧'],fr:['Francés','fr-FR','🇫🇷'],ja:['Japonés','ja-JP','🇯🇵'],ru:['Ruso','ru-RU','🇷🇺']};
const vc=l=>()=>{const i=R(0,11),d=j=>V[l][j]+(RM[l]?` (${RM[l][j]})`:''),o=pn([...Array(12).keys()].filter(x=>x!==i),3),s=[V[l][i],LN[l][1]];
return pk([0,1])?mk(`¿Cómo se dice <b>«${ES[i]}»</b> en ${LN[l][0]}?`,d(i),o.map(d),{say:s,after:1}):mk(`<div class="big2">${d(i)}</div>¿Qué significa?`,ES[i],o.map(j=>ES[j]),{say:s})};
const TR=[['Tengo agujas pero no pincho 🕐. ¿Qué soy?','Un reloj','Un cactus','Un erizo','Un pino'],['¿Cuál es el animal más grande del mundo? 🐋','La ballena azul','El elefante','La jirafa','El tiburón'],['Blanca por dentro, verde por fuera. Si quieres que te lo diga, espera 🍐','La pera','La manzana','El kiwi','El limón'],['¿Cuántos colores tiene el arcoíris 🌈?','7','5','9','6'],['¿Qué planeta está más cerca del Sol? ☀️','Mercurio','Venus','Marte','Júpiter'],['¿Cuántas patas tiene una araña 🕷️?','8','6','10','4'],['Vuelo sin alas y lloro sin ojos. ¿Qué soy?','La nube','El viento','El pájaro','La luna'],['¿En qué país está la Torre Eiffel? 🗼','Francia','Italia','Japón','Rusia'],['¿Cómo se dice «gracias» en japonés? 🇯🇵','Arigatō','Merci','Spasibo','Thanks'],['¿Qué dos colores mezclas para hacer verde? 🎨','Azul y amarillo','Rojo y azul','Rojo y blanco','Negro y blanco']];
const tri=()=>{const t=pk(TR);return mk(t[0],t[1],t.slice(2))};
const mixg=()=>pk([tri,tri,tri,()=>ops(R(0,1)),fal,col1,fig,ant,vc('en'),vc('fr')])();
const SUB={
mate:['Matemáticas','🔢','#ffd166',[['➕ Operaciones',ops],['🔺 Cuenta formas',cnt],['🧩 Problemas con formas',sto],['🔁 Patrones',pat]],1],
esp:['Español','📚','#ff9bd2',[['✏️ Completa la palabra',fal],['🔤 Ortografía',ort],['↔️ Antónimos',ant]]],
col:['Colores','🎨','#9be7ff',[['🍎 ¿De qué color es?',col1],['🖌️ Mezclas',mix]]],
for:['Formas','🔷','#b9f6ca',[['🔍 Identifica la figura',fig],['📐 Cuenta los lados',lad],['🔁 Patrones',pat]]],
idi:['Idiomas','🌍','#d1b3ff',Object.keys(LN).map(l=>[`${LN[l][2]} ${LN[l][0]}`,vc(l)])],
tri:['Trivia en equipo','🤝','#ffab91']};
const TH={sakura:'🌸 Sakura',neon:'🌃 Neón',ocean:'🌊 Océano',menta:'🍃 Menta'};

/* cuenta y pantallas */
let U=null,A={},tab='sp',lv=0,Q=null;
const users=()=>ld('dm_u',{}),save=()=>{const us=users();us[U.e]=U;sv('dm_u',us)};
function auth(m='in'){app.innerHTML=`<div class="card" style="max-width:430px;margin:20px auto;width:100%"><h1 class="logo">DIMECA STUDY</h1><p class="c">Aprende jugando ✨ mates, español, colores, formas e idiomas</p><div class="row" style="justify-content:center"><button class="${m=='in'?'on':''}" onclick="auth('in')">Entrar</button><button class="${m=='up'?'on':''}" onclick="auth('up')">Crear cuenta</button></div><input id="e" type="email" placeholder="Correo electrónico" autocomplete="email">${m=='up'?'<input id="n" placeholder="Nombre de usuario" maxlength="14">':''}<input id="p" type="password" placeholder="Contraseña" autocomplete="${m=='up'?'new':'current'}-password"><label class="ck"><input id="r" type="checkbox" checked> Mantener sesión iniciada</label><button class="big" onclick="go('${m}')">${m=='in'?'¡Entrar! 🚀':'¡Crear mi cuenta! 🎉'}</button><p id="er" class="er"></p></div>`}
function go(m){const e=$('#e').value.trim().toLowerCase(),p=$('#p').value,us=users(),er=t=>$('#er').textContent=t;
if(!/^\S+@\S+\.\S+$/.test(e))return er('Escribe un correo válido 📧');if(p.length<4)return er('La contraseña necesita 4 o más caracteres 🔑');
if(m=='up'){const n=$('#n').value.trim();if(n.length<2)return er('Elige un nombre de usuario ✏️');if(us[e])return er('Ese correo ya tiene cuenta. ¡Entra!');us[e]={e,u:n,p:hsh(p),c:20,own:[],av:{...DA},th:'sakura',pt:0};sv('dm_u',us);begin(e,$('#r').checked,1)}
else{if(!us[e]||us[e].p!=hsh(p))return er('Correo o contraseña incorrectos 🙈');begin(e,$('#r').checked)}}
function begin(e,r,nw){U=users()[e];if(!U)return auth();if(r)sv('dm_s',e);else try{sessionStorage.setItem('dm_s',e)}catch(x){}document.documentElement.dataset.t=U.th;nw?dress():home()}
function out(){mem.dm_s=null;try{localStorage.removeItem('dm_s');sessionStorage.removeItem('dm_s')}catch(e){}U=null;auth()}
function home(){app.innerHTML=`<div class="card"><div class="row"><div>${av(U.av,80)}</div><div style="flex:1;min-width:140px"><h2 style="margin:0">¡Hola, ${esc(U.u)}!</h2><b>🪙 ${U.c} monedas · ⭐ ${U.pt||0}</b></div><button onclick="dress()">👗 Vestuario</button><button onclick="out()">🚪 Salir</button></div><div class="row" style="margin-top:10px"><span>Diseño:</span>${Object.entries(TH).map(([k,v])=>`<button class="${U.th==k?'on':''}" onclick="theme('${k}')">${v}</button>`).join('')}</div></div><div class="grid">${Object.entries(SUB).map(([k,s])=>`<button class="sub" style="background:${s[2]}" onclick="sub('${k}')"><b>${s[1]}</b>${s[0]}</button>`).join('')}</div>`}
function theme(k){U.th=k;save();document.documentElement.dataset.t=k;snd.cl();home()}
function sub(k){const s=SUB[k];let h=`<div class="card"><div class="row"><button onclick="home()">⬅️</button><h2 style="margin:0">${s[1]} ${s[0]}</h2></div>`;
if(s[4])h+=`<p>Elige tu edad:</p><div class="row">${['6–8 años','9–10 años','11–12 años'].map((t,i)=>`<button class="${lv==i?'on':''}" onclick="lv=${i};sub('${k}')">${t}</button>`).join('')}</div>`;
if(k=='tri')h+=`<p>Juega con un amigo en el mismo dispositivo: se turnan y suman puntos juntos 🤝</p><input id="p1" placeholder="Jugador 1" value="${esc(U.u)}"><input id="p2" placeholder="Jugador 2 (tu amigo)"><button class="big" onclick="coop()">¡Jugar en equipo! 🎉</button>`;
else h+=`<p>Elige un minijuego:</p><div class="grid">${s[3].map((g,i)=>`<button class="sub" onclick="play('${k}',${i})">${g[0]}</button>`).join('')}</div>`;
app.innerHTML=h+'</div>'}
const play=(k,i)=>begin2({g:SUB[k][3][i][1]});
const coop=()=>begin2({g:mixg,pl:[$('#p1').value.trim()||'Jugador 1',$('#p2').value.trim()||'Jugador 2']});
function begin2(o){Q={...o,n:8,i:0,ok:0,t:0};ask()}
function ask(){const q=Q.cur=Q.g(lv);Q.lock=0;
app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><button onclick="if(confirm('¿Salir del juego?'))home()">✖</button><b>${Q.i+1}/${Q.n}</b><b>⭐ ${Q.ok}</b></div>${Q.pl?`<p class="c">🤝 Turno de <b>${esc(Q.pl[Q.t])}</b></p>`:''}<div class="bar"><div style="width:${Q.i/Q.n*100}%"></div></div><div class="q">${q.q}${q.say?` <button onclick="say('${q.say[0]}','${q.say[1]}')">🔊</button>`:''}</div><div class="opts">${q.o.map((o,i)=>`<button id="b${i}" onclick="ans(${i})">${o}</button>`).join('')}</div></div>`;
if(q.say&&!q.after)say(q.say[0],q.say[1])}
function ans(i){if(Q.lock)return;Q.lock=1;const q=Q.cur,ok=i==q.a;$('#b'+i).classList.add(ok?'ok':'no');$('#b'+q.a).classList.add('ok');ok?(Q.ok++,snd.ok()):snd.no();if(q.say&&q.after)say(q.say[0],q.say[1]);setTimeout(()=>{Q.i++;Q.t=1-Q.t;Q.i>=Q.n?end():ask()},1200)}
function end(){const c=Q.ok*(Q.pl?4:3)+(Q.ok==Q.n?10:0),st=Math.round(Q.ok/Q.n*3);U.c+=c;U.pt=(U.pt||0)+Q.ok;save();snd.win();
app.innerHTML=`<div class="card c"><h1>${['😢','🙂','😃','🏆'][st]} ¡Terminaste!</h1><p class="big2">${'⭐'.repeat(st)||'💪'}</p><p>Aciertos: <b>${Q.ok}/${Q.n}</b></p><p>Ganaste <b>🪙 ${c}</b> monedas (tienes ${U.c})</p><div class="row" style="justify-content:center"><button class="on" onclick="begin2(Q)">🔁 Otra vez</button><button onclick="dress()">👗 Gastar monedas</button><button onclick="home()">🏠 Menú</button></div></div>`}

/* vestuario */
function dress(){A={...U.av};tab='sp';edit()}
function edit(){const cf=CF[tab],pal=tab=='sp'?SK:PAL;
app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><button onclick="home()">⬅️ Menú</button><b>🪙 ${U.c}</b></div><div class="row" style="align-items:flex-start;justify-content:center"><div class="c">${av(A,230)}<div><button onclick="rnd()">🎲 Sorpresa</button></div></div><div style="flex:1;min-width:260px"><div class="row">${TB.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';edit()">${t[1]}</button>`).join('')}</div><p>Estilo (🔒 = se compra con monedas):</p><div class="row">${IT[tab].map((n,i)=>{const lk=CO[tab][i]&&!U.own.includes(tab+i);return`<button class="chip ${A[tab]==i?'on':''} ${lk?'lk':''}" onclick="pick(${i})">${n}${lk?' 🔒'+CO[tab][i]:''}</button>`}).join('')}</div><p>Color:</p><div class="row">${pal.map(c=>`<button class="sw" style="background:${c}" onclick="A.${cf}='${c}';snd.cl();edit()"></button>`).join('')}</div></div></div><button class="big" onclick="keep()">💾 Guardar mi skin</button></div>`}
function pick(i){const k=tab+i,c=CO[tab][i];if(c&&!U.own.includes(k)){if(U.c<c)return toast(`Necesitas 🪙 ${c}. ¡Juega para ganar monedas!`);U.c-=c;U.own.push(k);save();toast('¡Desbloqueado! 🎉');snd.win()}else snd.cl();A[tab]=i;edit()}
function rnd(){for(const t in IT){const ok=IT[t].map((_,i)=>i).filter(i=>!CO[t][i]||U.own.includes(t+i));A[t]=pk(ok);A[CF[t]]=pk(t=='sp'?SK:PAL)}snd.cl();edit()}
function keep(){U.av={...A};save();snd.win();toast('¡Skin guardada! 💖');home()}

const s=ld('dm_s',null)||(()=>{try{return sessionStorage.getItem('dm_s')}catch(e){}})();
s&&users()[s]?begin(s,true):auth();
</script></body></html>
